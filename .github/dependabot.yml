version: 2
updates:
  # ML runtime dependencies (requirements.txt). Grouped so routine patch/minor
  # bumps land as a single PR. Note: mlx and other Apple-Silicon-native wheels
  # only resolve on macOS arm64, so review these bumps on the Mac.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      ml-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
