[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    integration: end-to-end tests against a running ML service (opt-in via ML_SERVICE_URL)
filterwarnings =
    # swig-generated bindings in a third-party C-extension dep (surfaced on import
    # under tests/test_convert_siglip2_mlx.py) emit these on Python 3.11; not our
    # code. Keep the pattern narrow so our own DeprecationWarnings still surface.
    ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    # insightface's face_align calls skimage's deprecated SimilarityTransform.estimate
    # (third-party-internal; we only call insightface). Scope to that module so a
    # future deprecation of our own would still surface.
    ignore:`estimate` is deprecated since version 0\.26:FutureWarning:insightface.utils.face_align
