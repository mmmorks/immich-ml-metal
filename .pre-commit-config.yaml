# Pre-commit gate for the ml submodule (immich-ml-metal).
# Installed by the parent repo's ./scripts/setup-git-hooks.sh (or: pre-commit install)
#
# ruff (lint + format) + a gitleaks secret scan run here. gitleaks runs at
# commit time on purpose: a secret caught only in CI is already on the remote.
# Requires the gitleaks binary on PATH (brew install gitleaks).
#
# The test suite and pyright are NOT run here: both need the heavy native venv
# (mlx, insightface, cv2, onnxruntime) which isn't always present, and mlx is
# Apple-Silicon-only. Run those manually:
#   .venv/bin/python -m pytest        # tests
#   pyright                           # type check (needs the venv on PYTHONPATH)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
